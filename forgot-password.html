<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | PhishGuard</title>
  <meta name="theme-color" content="#080b12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/app-icon-192.png">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-container auth-single">
    <section class="auth-box">
      <a class="logo auth-logo" href="index.html">PhishGuard</a>
      <h1>Forgot your password?</h1>
      <p class="description">Enter your account email and we’ll send a one-time reset link.</p>
      <form id="forgotForm">
        <label for="resetEmail">Email address</label>
        <input id="resetEmail" type="email" autocomplete="email" required placeholder="you@example.com">
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        <button type="submit">Send reset link</button>
      </form>
      <p class="account-text"><a href="index.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
