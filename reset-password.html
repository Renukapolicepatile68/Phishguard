<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a new password | PhishGuard</title>
  <meta name="theme-color" content="#080b12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/app-icon-192.png">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-container auth-single">
    <section class="auth-box">
      <a class="logo auth-logo" href="index.html">PhishGuard</a>
      <h1>Choose a new password</h1>
      <p class="description">Reset links expire after one hour and can only be used once.</p>
      <form id="resetForm">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <label for="confirmNewPassword">Confirm new password</label>
        <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        <button type="submit">Reset password</button>
      </form>
      <p class="account-text"><a href="index.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
