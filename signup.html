<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a PhishGuard account to save URL analysis and manage scan history.">
    <meta name="theme-color" content="#080b12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PhishGuard">

    <title>PhishGuard - Sign Up</title>

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/app-icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">

</head>


<body>

    <div class="auth-container">

        <!-- LEFT SIDE -->

        <div class="auth-left">

            <a class="logo" href="index.html">PhishGuard</a>

            <p class="subtitle">
                URL Pattern Analysis
            </p>

            <div class="welcome-text">
                <span class="auth-kicker">Personal link protection</span>
                <h1>Join PhishGuard</h1>

                <p>
                    Create an account to save URL analysis
                    and manage your scan history.
                </p>

            </div>

        </div>


        <!-- SIGNUP BOX -->

        <div class="auth-box">

            <h2>Create Account</h2>

            <p class="description">
                Create your PhishGuard account
            </p>


            <form id="signupForm">

                <label for="name">Full Name</label>

                <input type="text" id="name" name="name" autocomplete="name" minlength="2" maxlength="80" placeholder="Enter your full name" required>


                <label for="signupEmail">Email Address</label>

                <input type="email" id="signupEmail" name="email" autocomplete="email" placeholder="Enter your email" required>


                <label for="signupPassword">Password</label>

                <input type="password" id="signupPassword" name="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Create a password (8+ characters)" required>


                <label for="confirmPassword">Confirm Password</label>

                <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Confirm your password" required>


                <label class="terms">

                    <input type="checkbox" required>

                    I agree to create an account

                </label>


                <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>

                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="account-text">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pwa.js"></script>

</body>

</html>
